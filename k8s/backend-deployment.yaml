apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: doz23/disney-backend:latest # Replace with your Docker image name
        ports:
        - containerPort: 5000
        env:
        - name: FLASK_ENV
          value: "development"
      imagePullSecrets:
        - name: regcred
