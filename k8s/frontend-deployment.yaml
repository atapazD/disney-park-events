apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: doz23/disney-frontend:develop # Replace with your Docker image name
        ports:
        - containerPort: 3000
      imagePullSecrets:
        - name: regcred
