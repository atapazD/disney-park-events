name: CI/CD Pipeline for Disney Park Events

on:
  push:
    branches:
      - develop
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Step 3: Set Image Tag Based on Branch
      - name: Set Image Tag
        run: echo "IMAGE_TAG=$(echo $GITHUB_REF | awk -F'/' '{print $3}')" >> $GITHUB_ENV

      # Step 4: Build, Inspect, and Push Backend Image
      - name: Build Backend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/disney-backend:${{ env.IMAGE_TAG }} ./backend
      - name: Inspect Backend Image Architecture
        run: |
          docker image inspect ${{ secrets.DOCKER_USERNAME }}/disney-backend:${{ env.IMAGE_TAG }} --format 'Backend Architecture: {{ .Architecture }}'
      - name: Push Backend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/disney-backend:${{ env.IMAGE_TAG }}

      # Step 5: Build, Inspect, and Push Frontend Image
      - name: Build Frontend Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/disney-frontend:${{ env.IMAGE_TAG }} ./frontend
      - name: Inspect Frontend Image Architecture
        run: |
          docker image inspect ${{ secrets.DOCKER_USERNAME }}/disney-frontend:${{ env.IMAGE_TAG }} --format 'Frontend Architecture: {{ .Architecture }}'
      - name: Push Frontend Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/disney-frontend:${{ env.IMAGE_TAG }}

      # Optional: Trigger ArgoCD Sync (if needed)
      # - name: Trigger ArgoCD Sync
      #   run: |
      #     kubectl apply -f k8s/backend-deployment.yaml
      #     kubectl apply -f k8s/backend-service.yaml
      #     kubectl apply -f k8s/frontend-deployment.yaml
      #     kubectl apply -f k8s/frontend-service.yaml