name: CI/CD Pipeline for Disney Park Events

on:
  push:
    branches:
      - develop
      - master

jobs:
  build-and-deploy:
    runs-on: macOS-latest  # Ensure this runner is an Apple Silicon (ARM64) machine

    steps:
      # Step 1: Checkout the Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Install Homebrew (if not already installed) and set it up
      - name: Install Homebrew
        run: |
          # Install Homebrew if not installed (this script is idempotent)
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" || true
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >> $GITHUB_ENV
          eval "$(/opt/homebrew/bin/brew shellenv)"

      # Step 3: Install Colima and start it to provide Docker functionality
      - name: Install Colima and Start Docker
        run: |
          brew install colima
          colima start

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Step 5: Set Image Tag Based on Branch
      - name: Set Image Tag
        run: echo "IMAGE_TAG=$(echo $GITHUB_REF | awk -F'/' '{print $3}')" >> $GITHUB_ENV

      # Step 6: Build and Push Backend Image
      - name: Build and Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/disney-backend:${{ env.IMAGE_TAG }} ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/disney-backend:${{ env.IMAGE_TAG }}

      # Step 7: Build and Push Frontend Image
      - name: Build and Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/disney-frontend:${{ env.IMAGE_TAG }} ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/disney-frontend:${{ env.IMAGE_TAG }}

      # Optional: Trigger ArgoCD Sync (if needed)
      # - name: Trigger ArgoCD Sync
      #   run: |
      #     kubectl apply -f k8s/backend-deployment.yaml
      #     kubectl apply -f k8s/backend-service.yaml
      #     kubectl apply -f k8s/frontend-deployment.yaml
      #     kubectl apply -f k8s/frontend-service.yaml